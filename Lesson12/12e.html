<!DOCTYPE html>
<html>
<head>
    <title>12e - Flexbox</title>

    <style>
        .container {
            width: 250px;
            border: 1px solid lightgray;
            padding: 10px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .row p {
            margin: 0;
            font-size: 14px;
        }

        .number {
            background-color: #4169e1;
            color: white;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="row">
            <p>Home</p>
            <div class="number">14</div>
        </div>

        <div class="row">
            <p>Notifications</p>
            <div class="number">3</div>
        </div>

        <div class="row">
            <p>Messages</p>
            <div class="number">5</div>
        </div>

    </div>

</body>
</html>
