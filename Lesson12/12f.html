<!doctype html>
<html>
  <head>
    <title>Exercise 12f</title>

    <style>
      .navbar {
        height: 50px;
        background-color: rgb(112, 87, 214);

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 15px;
      }

      .home {
        color: white;
      }

      .search {
        width: 500px;
        height: 25px;
        border-radius: 20px;
        border: none;
        padding-left: 15px;
      }

      .download {
        background-color: transparent;
        color: white;
        border: 1px solid white;
        padding: 8px 15px;
      }
    </style>
  </head>

  <body>
    <div class="navbar">
      <div class="home">Home</div>

      <input type="text" class="search" placeholder="Search" />

      <button class="download">Download</button>
    </div>
  </body>
</html>
