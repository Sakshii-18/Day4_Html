<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .profile {
        display: flex;
        flex-direction: row;
        flex: 1;
        padding: 10px;
        width: 400px;
        gap: 15px;
      }

      .profile-pic {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        object-fit: cover;
      }

      .info {
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      .info p {
        margin: 3px 0;
      }

      button {
        background-color: #0095ff;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
  </head>

    <div class="profile">
      <img src="../photos/cat_image.jpg" alt="cat_image" class="profile-pic" />
